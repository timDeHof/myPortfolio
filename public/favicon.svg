<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="25%" cy="15%" r="120%">
      <stop offset="0%" stop-color="#182846"/>
      <stop offset="100%" stop-color="#080d17"/>
    </radialGradient>
    <radialGradient id="cobalt" cx="85%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#3568e8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3568e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="10%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#37c4b0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#37c4b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="g-teal" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#37c4b0" flood-opacity="0.6"/>
    </filter>
    <filter id="g-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#f5961e" flood-opacity="0.7"/>
    </filter>
    <filter id="g-cobalt" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#4a82f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- squircle body -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)" stroke="#37c4b0" stroke-opacity="0.38" stroke-width="6"/>
  <!-- glow overlays -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#cobalt)"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#teal)"/>
  <!-- code mark </ > with geometric monospace style -->
  <!-- < bracket (teal) -->
  <path d="M202 192 L118 256 L202 320" fill="none" stroke="#37c4b0" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6" filter="url(#g-teal)"/>
  <!-- / slash (amber) -->
  <path d="M292 146 L222 366" stroke="#f5961e" stroke-width="28" stroke-linecap="butt" filter="url(#g-amber)"/>
  <!-- > bracket (cobalt) -->
  <path d="M312 192 L396 256 L312 320" fill="none" stroke="#4a82f7" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6" filter="url(#g-cobalt)"/>
</svg>
