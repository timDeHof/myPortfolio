<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tim DeHof - Full Stack Developer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Tim DeHof" />

    <!-- Theme class before the first paint, by the same rule as useTheme, so dark mode doesn't flash light -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("portfolio-storage") || "{}");
          var theme = stored.state && stored.state.theme;
          var isDark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(isDark ? "dark" : "light");
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (error) {
          // Blocked storage or bad JSON: useTheme applies the theme after mount
        }
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="32x32 16x16" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-64x64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="src/styles/index.css" />

    <!-- Google Fonts - DM Sans and JetBrains Mono (Non-blocking) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- Theme color - Cobalt -->
    <meta name="theme-color" content="#3568e8" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- RFC 9727 API catalog -->
    <link rel="api-catalog" href="/.well-known/api-catalog" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
